<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#090b10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="../manifest.webmanifest">
  <title>Coji and the Castle Below — 2.5D Gameplay Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #ece3ce;
      --muted: #a7a394;
      --gold: #dfb55d;
      --blue: #82c9ff;
      --panel: rgba(11, 13, 19, .82);
      --line: rgba(255, 255, 255, .12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #090b10;
      color: var(--paper);
      font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .game-shell {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      position: relative;
      width: 100%;
      height: 100vh;
      height: var(--app-height, 100dvh);
      background: #090b10;
      overflow: hidden;
      isolation: isolate;
    }

    .game-shell:is(:fullscreen, :-webkit-full-screen) { width: 100%; height: 100%; }

    .game-actions {
      position: absolute;
      z-index: 2;
      top: max(10px, var(--safe-top));
      right: max(10px, var(--safe-right));
      display: flex;
      align-items: flex-start;
      gap: 6px;
      pointer-events: auto;
    }

    .small-button {
      display: grid;
      place-items: center;
      appearance: none;
      min-height: 44px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel);
      color: var(--paper);
      line-height: 1.2;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      touch-action: manipulation;
      cursor: pointer;
    }

    .small-button[hidden] { display: none; }
    .small-button:hover, .small-button:focus-visible { background: #282638; }
    .small-button[aria-pressed="true"] {
      border-color: rgba(130, 201, 255, .52);
      background: #20384e;
      color: #dff3ff;
    }

    .game-settings { position: relative; }
    .game-settings summary { list-style: none; }
    .game-settings summary::-webkit-details-marker { display: none; }

    .settings-panel {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      display: grid;
      min-width: 116px;
      gap: 5px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #11131d;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
      -webkit-tap-highlight-color: transparent;
    }

    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .health-panel {
      position: absolute;
      left: max(10px, var(--safe-left));
      top: max(10px, var(--safe-top));
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }

    .portrait {
      width: 34px;
      height: 34px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(223,181,93,.42);
      border-radius: 10px;
      background:
        radial-gradient(circle at 50% 70%, rgba(120,175,226,.22), transparent 48%),
        linear-gradient(145deg, #273264, #101326);
      box-shadow: inset 0 0 15px rgba(0,0,0,.5);
    }

    .portrait-face {
      position: absolute;
      left: 10px;
      top: 12px;
      width: 15px;
      height: 16px;
      border-radius: 48% 48% 44% 44%;
      background: linear-gradient(135deg, #ffd1af, #bd7767);
      box-shadow: 0 1px 0 #161722, inset 3px 0 4px rgba(255,255,255,.18);
    }

    .portrait-hat {
      position: absolute;
      left: 4px;
      top: 5px;
      width: 27px;
      height: 8px;
      border-radius: 50%;
      background: #24275c;
      box-shadow: 0 1px 0 #0c0d18;
    }

    .portrait-hat::before {
      content: "";
      position: absolute;
      left: 7px;
      bottom: 3px;
      width: 13px;
      height: 19px;
      clip-path: polygon(10% 100%, 42% 8%, 90% 100%);
      background: linear-gradient(135deg, #58609d, #1b1e4b 70%);
    }

    .portrait-hat::after {
      content: "✦";
      position: absolute;
      left: 11px;
      top: -10px;
      color: #e9bd60;
      font-size: 7px;
    }

    .hud-name {
      color: #bdb8aa;
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .14em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .hearts {
      display: flex;
      gap: 4px;
      min-width: 82px;
    }

    .heart {
      color: #dd665d;
      font-size: 18px;
      line-height: 1;
      filter: drop-shadow(0 0 5px rgba(221, 102, 93, .36));
      transition: opacity .18s, transform .18s;
    }

    .heart.empty {
      opacity: .2;
      transform: scale(.86);
      filter: grayscale(1);
    }

    .monster-panel {
      display: none;
      position: absolute;
      left: 50%;
      top: 17px;
      width: min(280px, 38vw);
      transform: translateX(-50%);
      text-align: center;
      transition: opacity .2s;
    }

    .monster-name {
      color: #d9c9db;
      font: 600 12px Georgia, serif;
      letter-spacing: .04em;
      text-shadow: 0 2px 5px #000;
      margin-bottom: 6px;
    }

    .monster-bar {
      height: 8px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.19);
      border-radius: 999px;
      background: rgba(12,8,15,.8);
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }

    .monster-bar i {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #6f264d, #b24769);
      box-shadow: 0 0 10px rgba(195,63,108,.45);
      transition: width .2s;
    }

    .instruction:empty { display: none; }
    .instruction {
      position: absolute;
      left: 50%;
      bottom: max(12px, var(--safe-bottom));
      transform: translateX(-50%);
      max-width: calc(100% - max(12px, var(--safe-left)) - max(12px, var(--safe-right)));
      padding: 9px 14px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 999px;
      background: rgba(8,10,15,.76);
      backdrop-filter: blur(9px);
      color: #d6d1c5;
      font-size: 11px;
      text-align: center;
      white-space: nowrap;
      box-shadow: 0 8px 30px rgba(0,0,0,.28);
    }

    .event-message {
      position: absolute;
      left: 50%;
      top: calc(max(10px, var(--safe-top)) + 80px);
      transform: translate(-50%, -8px);
      color: #f7dfaa;
      font: 650 15px Georgia, serif;
      text-shadow: 0 2px 8px #000, 0 0 14px rgba(223,181,93,.35);
      opacity: 0;
      transition: opacity .2s, transform .2s;
    }

    .event-message.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #trialClock {
      position:absolute; transform:translate(-50%,-100%); pointer-events:none;
      color:#fff3d6; text-shadow:0 1px 3px #1e100a,0 0 5px #29170c;
      font:700 clamp(18px,2.6vh,26px)/1.15 system-ui; font-variant-numeric:tabular-nums;
    }
    #trialClock.urgent { color:#ff9479; }
    .room-label {
      position: absolute;
      top: calc(max(10px, var(--safe-top)) + 9px);
      left: 50%;
      transform: translateX(-50%);
      color: #ebd7ab;
      font-size: 12px;
      letter-spacing: .13em;
      text-shadow: 0 2px 8px #000, 0 0 14px #000;
      white-space: nowrap;
    }

    .exit-marker {
      position: absolute;
      z-index: 1;
      top: 0;
      left: 0;
      min-height: 42px;
      padding: 6px 12px;
      border: 1px solid rgba(223,181,93,.55);
      border-radius: 7px;
      background: rgba(16,13,13,.91);
      box-shadow: 0 4px 14px rgba(0,0,0,.55);
      color: #f2dab1;
      font-size: 12px;
      white-space: nowrap;
      pointer-events: auto;
      cursor: pointer;
      touch-action: manipulation;
    }

    .exit-marker:hover, .exit-marker:focus-visible { background: #382a21; }

    .inventory-count {
      color: #f2dab1;
      font-size: 11px;
      margin-top: 3px;
    }

    .debug-label {
      position: absolute;
      right: max(10px, var(--safe-right));
      bottom: calc(max(12px, var(--safe-bottom)) + 57px);
      display: none;
      min-width: 128px;
      padding: 9px 10px;
      border: 1px solid rgba(130,201,255,.25);
      border-radius: 11px;
      background: rgba(7,10,16,.76);
      color: #9ed5ff;
      font: 9px/1.55 ui-monospace, "SFMono-Regular", Menlo, monospace;
      backdrop-filter: blur(8px);
    }

    .debug-label.show { display: block; }

    @media (max-width: 680px) {
      .room-label { top: calc(max(10px, var(--safe-top)) + 62px); }
      .small-button { padding-inline: 8px; }
      .health-panel { gap: 7px; padding: 7px 8px; }
      .instruction { white-space: normal; width: max-content; }
    }

    #sceneLoading { position:absolute; inset:0; z-index:8; display:grid; place-content:center; justify-items:center;
      gap:12px; color:#eed9aa; background:#131114; font:16px Georgia,serif; }
    #sceneLoading.fade-through { background:#0b0a10; }
    #sceneLoading.fade-through span { animation: reveal-load .25s .5s backwards; }
    @keyframes reveal-load { from { opacity:0; } to { opacity:1; } }
    #sceneLoading[hidden] { display:none; }
    #sceneLoading button[hidden] { display:none; }
    #trialControls {
      position: absolute;
      bottom: calc(max(12px, var(--safe-bottom)) + 42px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }
    #trialControls.in-trial {
      left: max(12px, var(--safe-left));
      transform: none;
    }
    #trialControls[hidden], #trialControls [hidden] { display: none; }
    #doorSelect {
      max-width: 80vw;
      min-height: 44px;
      color: #f4e4bf;
      background: #201b19;
      border: 1px solid #8b744c;
      border-radius: 8px;
      padding: 0 10px;
      font: inherit;
      font-size: 13px;
    }
    #trialDialog {
      color: #38261a;
      text-align: center;
      width: min(440px, calc(100% - 24px));
      max-height: none;
      padding: 0;
      background: radial-gradient(ellipse at 50% 34%, #fff2ce, #dabe89 82%, #b08b54);
      border: 4px double #977641;
      border-radius: 5px;
      box-shadow: 0 18px 80px #050306bd, inset 0 0 28px #99713b4f;
    }
    #trialDialog::backdrop { background: #080611b8; }
    #trialDialog form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: clamp(14px, 3vh, 26px);
      max-height: calc(var(--app-height, 100dvh) - 32px - var(--safe-top) - var(--safe-bottom));
    }
    .scroll-content { overflow-y: auto; overscroll-behavior: contain; }
    #trialTitle { font-size: 16px; letter-spacing: .12em; margin: 12px 0; }
    #trialText { font: 600 clamp(21px, 4vw, 27px)/1.3 Georgia, serif; margin: 12px 0 16px; }
    #rulePicker { font: 13px system-ui; color: #584327; }
    #ruleSelect { font: inherit; min-height: 38px; margin-left: 6px; padding: 4px 8px; border: 1px solid #96794e; background: #f4e4bd; color: #342719; border-radius: 3px; }
    #trialConfirm { flex: none; min-height: 44px; touch-action: manipulation; background: #443426; border: 1px solid #7e613e; color: #fff2d1; padding: 12px 22px; font-weight: 700; border-radius: 5px; cursor: pointer; }
    @media (max-width: 680px) {
      .monster-panel { top: calc(max(10px, var(--safe-top)) + 65px); }
      #trialControls { bottom: calc(max(12px, var(--safe-bottom)) + 54px); }
    }

    .forward-trial .event-message {
      color: #fff0c9; background: #302019ec; border: 1px solid #c29559;
      padding: 6px 13px; border-radius: 4px; font-size: clamp(15px, 2vw, 21px);
      text-align: center; width: max-content; max-width: 85%;
    }
    @media (max-width: 680px) {
      .forward-trial .event-message { top: calc(max(10px, var(--safe-top)) + 88px); }
    }
    .boss-fight .room-label { display: none; }
  </style>
</head>
<body>
  <main class="game-shell" id="gameShell" aria-label="Coji and the Castle Below">
    <canvas id="gameCanvas" aria-label="Coji 2.5D 移動與戰鬥遊戲示範"></canvas>
    <div class="hud">
      <nav class="game-actions" aria-label="遊戲操作">
        <a class="small-button" href="../index.html">主選單</a>
        <button class="small-button" type="button" id="fullscreenButton" hidden>全螢幕</button>
        <details class="game-settings" id="gameSettings">
          <summary class="small-button">設定</summary>
          <div class="settings-panel">
            <button class="small-button" type="button" id="fxButton" aria-pressed="true">畫面效果</button>
            <button class="small-button" type="button" id="gridButton" aria-pressed="false">格線</button>
            <button class="small-button" type="button" id="trialShortcut">地下試煉長廊</button>
            <button class="small-button" type="button" id="resetButton">重置</button>
          </div>
        </details>
      </nav>
      <div class="health-panel">
        <div class="portrait"><span class="portrait-face" aria-hidden="true">&#8203;</span><span class="portrait-hat" aria-hidden="true">&#8203;</span></div>
        <div>
          <div class="hud-name">Coji · Mage</div>
          <div class="hearts" id="hearts"></div>
          <div class="inventory-count" id="inventoryCount" aria-live="polite" hidden></div>
        </div>
      </div>
      <div class="monster-panel" id="monsterPanel">
        <div class="monster-name" id="monsterName">Shadow Imp</div>
        <div class="monster-bar"><i id="monsterHealth"></i></div>
      </div>
      <div id="trialControls" hidden>
        <select id="doorSelect" aria-label="前往試煉門"><option value="">選擇一扇門…</option></select>
        <button class="small-button" id="readRule" type="button">閱讀卷軸</button>
        <button class="small-button" id="leaveTrial" type="button">返回長廊</button>
      </div>
      <div id="trialClock" role="timer" aria-label="Crossing time remaining in seconds" lang="en" hidden></div>
      <div class="event-message" id="eventMessage"></div>
      <div class="room-label" id="roomLabel" aria-live="polite"></div>
      <div class="instruction" id="roomHint" lang="en"></div>
      <button class="exit-marker" id="exitMarker" type="button" hidden></button>
      <button class="exit-marker" id="roomMarker" type="button" hidden></button>
      <button class="exit-marker" id="roomMarkerAlt" type="button" hidden></button>
      <button class="exit-marker" id="roomMarkerNorth" type="button" hidden></button>
      <button class="exit-marker" id="roomMarkerSouth" type="button" hidden></button>
      <button class="exit-marker" id="treasureMarker" type="button" hidden></button>
      <div class="debug-label" id="debugLabel"></div>
    </div>
    <div id="sceneLoading" role="status"><span id="loadingText">載入場景中…</span><button type="button" id="retryLoad" class="small-button" hidden>重試</button></div>
    <dialog lang="en" id="trialDialog" aria-labelledby="trialTitle" aria-describedby="trialText">
      <form method="dialog">
        <div class="scroll-content">
          <h2 id="trialTitle"></h2>
          <p id="trialText"></p>
          <label id="rulePicker" hidden>Trial rule <select id="ruleSelect"></select></label>
        </div>
        <button id="trialConfirm" type="submit" value="confirm"></button>
      </form>
    </dialog>
  </main>

  <script>
    (function () {
      "use strict";

      window.CastleScenes = Object.create(null);
      const sceneRequests = new Map();
      function loadScene(name) {
        if (CastleScenes[name]) return Promise.resolve(CastleScenes[name]);
        if (!sceneRequests.has(name)) {
          const script = document.createElement("script");
          const request = new Promise((resolve, reject) => {
            script.onload = () => CastleScenes[name] ? resolve(CastleScenes[name]) : reject(new Error(name));
            script.onerror = () => reject(new Error(name));
            script.src = "scenes/" + name + ".js";
            document.head.append(script);
          }).finally(() => { sceneRequests.delete(name); script.remove(); });
          sceneRequests.set(name, request);
        }
        return sceneRequests.get(name);
      }
      const loadingPanel = document.getElementById("sceneLoading");
      const loadingText = document.getElementById("loadingText");
      const retryLoad = document.getElementById("retryLoad");
      let transition = 0;
      let loading = true;
      async function changeScene(prepare, activate, fadeThrough = false) {
        const ticket = ++transition;
        loading = true;
        loadingPanel.classList.toggle("fade-through",fadeThrough);
        loadingPanel.hidden = false;
        loadingText.textContent = "載入場景中…";
        retryLoad.hidden = true;
        try {
          const scene = await prepare();
          if (ticket !== transition) return;
          activate(scene);
          if (ticket !== transition) return;
          loading = false;
          loadingPanel.hidden = true;
        } catch (error) {
          if (ticket !== transition) return;
          loadingPanel.classList.remove("fade-through");
          console.error("Scene load failed", error);
          loadingText.textContent = "場景未能載入";
          retryLoad.hidden = false;
          retryLoad.onclick = () => changeScene(prepare, activate, fadeThrough);
        }
      }

      window.castleLoader = {loadScene, changeScene, get loading() { return loading; }};
      changeScene(() => Promise.all([loadScene("basement"), loadScene("sprite-frames")]), startGame);

    }());

    function startGame() {
      "use strict";
      const {loadScene, changeScene} = window.castleLoader;
      var canvas = document.getElementById("gameCanvas");
      var shell = document.getElementById("gameShell");
      var ctx = canvas.getContext("2d");
      var heartsNode = document.getElementById("hearts");
      var inventoryCount = document.getElementById("inventoryCount");
      var monsterPanel = document.getElementById("monsterPanel");
      var monsterHealth = document.getElementById("monsterHealth");
      var monsterName = document.getElementById("monsterName");
      var eventMessage = document.getElementById("eventMessage");
      var debugLabel = document.getElementById("debugLabel");
      var fxButton = document.getElementById("fxButton");
      var gridButton = document.getElementById("gridButton");
      var resetButton = document.getElementById("resetButton");
      var fullscreenButton = document.getElementById("fullscreenButton");
      var gameSettings = document.getElementById("gameSettings");
      var requestFullscreen = shell.requestFullscreen || shell.webkitRequestFullscreen;
      var exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
      var roomLabel = document.getElementById("roomLabel");
      var roomHint = document.getElementById("roomHint");
      var exitMarker = document.getElementById("exitMarker");
      var roomMarker = document.getElementById("roomMarker");
      var roomMarkerAlt = document.getElementById("roomMarkerAlt");
      var roomMarkers = [roomMarker, roomMarkerAlt, document.getElementById("roomMarkerNorth"),
        document.getElementById("roomMarkerSouth")];
      var treasureMarker = document.getElementById("treasureMarker");

      var TILE_W = 88;
      var TILE_H = 44;
      var MAX_HP = 4;
      var CAST_DURATION = .78;
      var CAST_UPPER_MIN_SLOPE = Math.tan(8 * Math.PI / 180);
      var COJI_SMALL_AURA_SCALE = .76;
      var LAMP_HEIGHT = 112;
      var FOREGROUND_WALL_OPACITY = .42;
      var blocked = new Set();
      var props = [];
      var projectiles = [];
      var particles = [];
      var mist = [];
      var worldMessages = [];
      const rooms = {};
      const lowerFloor = CastleScenes.basement(rooms);
      const upperFloor = { imps:[] };
      let activeAreas = [];
      var assets = {
        grain: null,
        stone: null,
        upperHall: null,
        glassGallery: null,
        cryptLanding: null,
        cryptCrossing: null,
        cryptOssuary: null,
        cryptArchive: null,
        cryptTreasury: null,
        closedChest: null,
        openChest: null,
        hallExterior: null,
        cryptExterior: null,
        lampPost: null,
        imp: null,
        cojiIdle: null,
        cojiCast: null,
        cojiCastUpper: null,
        cojiGuard: null,
        impWalkB: null,
        realisticReady: false,
        roomScenery: new Map(),
        exteriorWalls: [],
        wallFaces: new Set(),
        sceneryTime: 0,
        fogSprite: null,
        lampGlowSprite: null,
        windowGlowSprite: null,
        cojiWalkFrames: [],
        impFrames: [],
        cojiIdleFrames: [],
        cojiCastFrames: [],
        cojiGuardFrames: [],
        impFramesB: []
      };
      var showFx = true;
      var showGrid = false;
      var messageTimer = 0;
      var lastTime = performance.now();
      var gameTime = 0;
      var attackCooldown = 0;
      var castState = null;
      var cojiAura = { strength: 1, scale: COJI_SMALL_AURA_SCALE };
      var pointerGuard = false;
      var renderedPlayer = { x: 0, y: 0 };
      var camera = { x: 0, y: 0 };
      var targetMarker = null;
      var floor = lowerFloor;
      var room = rooms.corridor;
      var exitQueued = false;
      var passage = null;
      var roomFade = 0;
      var openedChests = new Set();
      var collectedLoot = new Set();
      var treasureAction = null;

      var player = {
        x: 9.5,
        y: 13.5,
        z: 0,
        hp: MAX_HP,
        path: [],
        speed: 3.4,
        guard: false,
        invul: 0,
        dir: 1,
        facing: 6,
        moving: false,
        walkPhase: 0,
        stepCycle: 0
      };

      function newImp(x, y) {
        return { x, y, alive: true, hp: 1, maxHp: 1, path: [], speed: 1.25,
          think: 0, attackCooldown: 1.2, windup: 0, hurt: 0, dir: -1, facing: 2,
          moving: false, walkPhase: 0, stepCycle: 0, screen: {} };
      }

      const assetFiles = {
        "upperHall": "forgotten-hall-lamps.webp",
        "glassGallery": "glass-gallery-knight.webp",
        "cryptLanding": "crypt-stair-landing.webp",
        "cryptCrossing": "crypt-crossing.webp",
        "cryptArchive": "crypt-archive.webp",
        "cryptTreasury": "crypt-treasury.webp",
        "closedChest": "castle-chest-closed.webp",

      const contactMasks = new WeakMap();
      const imageRequests = new Map();
      const sceneImages = new Map();

      function imageFor(name) {
        if (!sceneImages.has(name)) sceneImages.set(name, new Image());
        return sceneImages.get(name);
      }
      function loadImage(name) {
        if (assets[name]) return Promise.resolve(assets[name]);
        if (!imageRequests.has(name)) {
          const image = imageFor(name);
          const request = new Promise((resolve, reject) => {
            image.onload = () => { assets[name] = image; resolve(image); };
            image.onerror = () => reject(new Error(assetFiles[name]));
            image.src = "assets/" + assetFiles[name];
          }).finally(() => { imageRequests.delete(name); image.onload = image.onerror = null; });
          imageRequests.set(name, request);
        }
        return imageRequests.get(name);
      }
      function loadImages(names) {
        return Promise.all([...new Set(names)].map(loadImage));
      }

      function nearbyRooms(area, level) {
        const visible = new Set([area]);
        for (const link of level.links) {
          if (link.before === area) visible.add(link.after);
          if (link.after === area) visible.add(link.before);
        }
        return level.rooms.filter(other => visible.has(other));
      }

      function floorArt(area, level) {
        const nearby = nearbyRooms(area, level);
        const names = ["cojiIdle", "walkCycle", "stone", "lampPost",
          level === upperFloor ? "hallExterior" : "cryptExterior"];
        for (const other of nearby) {
          names.push(other.art.asset);
          if (other.art.leftWallAsset) names.push(other.art.leftWallAsset);
          if (other.treasure) names.push("closedChest", "openChest");
        }
        if (nearby.includes(rooms.corridor)) names.push("trialGate");
        if (level === upperFloor) names.push("cojiCast", "cojiCastUpper", "cojiGuard", "imp", "impWalkB");
        return loadImages(names);
      }

      var trials = createCastleTrials({
        rooms, player, canvas, ctx, roomHint, enterRoom, worldToScreen, showMessage, findPath,
        drawWallOpening, addParticle, damagePlayer, updateHud, stop: stopActions,
        view: () => room, time: () => gameTime, effects: () => showFx, maxHp: MAX_HP,
        art: rooms.archive.art
      });

      function stopActions() {
        player.path = [];
        player.moving = false;
        player.guard = false;
        pointerGuard = false;
        treasureAction = null;
        exitQueued = false;
        targetMarker = null;
      }

      function createTrialArt(game) {
        "use strict";
        const { ctx, worldToScreen: project } = game;
        const sprite = imageFor;
        const lectern = sprite("scrollLectern");
        const arch = sprite("trialGate");

        function glow(x, y, radius, color) {
          const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
          gradient.addColorStop(0, color);
          gradient.addColorStop(1, "transparent");
          ctx.fillStyle = gradient;
          ctx.fillRect(x - radius, y - radius, 2 * radius, 2 * radius);
        }

        function text(value, x, y, size, color) {
          ctx.font = "600 " + size + "px Georgia, system-ui, serif";
          ctx.textAlign = "center";
          ctx.fillStyle = color;
          ctx.fillText(value, x, y);
        }

        function gate(item, cleared) {
          const level = item.level;
          if (!arch.naturalWidth) game.drawWallOpening(ctx, { x: 0, y: 0 }, false, false, "x", 103);
          ctx.save();
          ctx.transform(1, -.5, 0, 1, 0, 0);
          if (arch.naturalWidth) ctx.drawImage(arch, -64, -194, 128, 194);
          glow(0, -74, 48, level.color + "55");
          text(level.glyph, 0, -66, 23, level.color);
          ctx.restore();
          const label = (cleared.has(level.id) ? "✓ " : "") + level.name;
          ctx.font = "600 15px system-ui";
          const width = ctx.measureText(label).width + 22;
          ctx.fillStyle = "#211c1af5";
          ctx.fillRect(-width / 2, -216, width, 27);
          ctx.strokeStyle = level.color;
          ctx.strokeRect(-width / 2, -216, width, 27);
          text(label, 0, -197, 15, "#ffe9be");
        }

        function object(item, cleared) {
          const p = project(item.x,item.y,0);
          ctx.save(); ctx.translate(p.x,p.y);
          if (item.type === "gate") gate(item,cleared);
          ctx.restore();
        }

        function hit(item,pos) {
          const p = project(item.x,item.y,0), dx = pos.x-p.x, dy = pos.y-p.y;
          if (item.type === "gate") {
            const wallY = dy + dx * .5;
            return Math.abs(dx) < 65 && ((wallY >= -194 && wallY <= 8) || (dy >= -218 && dy <= -188));
          }
          return false;
        }
        return { object, hit, sprite, arch, lectern };
      }

      function createCastleTrials(game) {
        "use strict";
        const { rooms, player, enterRoom, showMessage, roomHint } = game;
        const levels = [
          { id: "lava", name: "岩漿長廊", title: "The Ember Gallery", glyph: "♨", color: "#ec9c59" },
          { id: "procession", name: "幽靈引路", title: "The Ghost's Path", glyph: "♙", color: "#93d3dc" },
          { id: "eye", name: "魔眼走廊", title: "The Watchful Eye", glyph: "◉", color: "#b8d49b" },
          { id: "dragon", name: "雷焰惡龍", title: "The Thunderfire Dragon", glyph: "♛", color: "#ff845e" }
        ];
        const doors = levels.map((level, index) => ({
          type: "gate", level, x: 7.15, y: 30.5 + index * 9.6
        }));
        const control = document.getElementById("trialControls");
        const select = document.getElementById("doorSelect");
        const read = document.getElementById("readRule");
        const clock = document.getElementById("trialClock");
        const leave = document.getElementById("leaveTrial");
        const dialog = document.getElementById("trialDialog");
        const art = createTrialArt(game);
        let door = null;
        let approach = null;
        let session = null;
        let dialogAction = null;
        const cleared = new Set();
        let definition;
        const visits = new Map();
        const rulePicker = document.getElementById("rulePicker");
        const ruleSelect = document.getElementById("ruleSelect");
        ruleSelect.onchange = () => {
          if (!session?.waiting) return;
          const rule = definition.rules[ruleSelect.selectedIndex];
          if (session.id === "lava" && !!rule.banners !== !!session.rule.banners)
            session.board = definition.createBoard(finishRow,rule);
          session.rule = rule;
          document.getElementById("trialText").textContent = scrollText();
        };
        const finishRow = 54;
        let front;
        let battleAudio;
        function unlockBattleAudio() {
          const Context = window.AudioContext || window.webkitAudioContext;
          if (!Context) return;
          battleAudio ??= new Context();
          if (battleAudio.state !== "running") battleAudio.resume().catch(() => {});
        }
        // Touch input grants audio playback on release on mobile browsers.
        game.canvas.addEventListener("pointerup", () => {
          if (session?.arena || approach?.level.id === "dragon") unlockBattleAudio();
        });
        let hotVoice;
        let warningVoice;
        function primeLavaVoices() {
          if (session?.id !== "lava" || !session.waiting) return;
          for (const clip of [hotVoice,warningVoice]) {
            clip.muted = true;
            clip.play().then(() => { clip.pause(); clip.currentTime=0; clip.muted=false; })
              .catch(() => { clip.muted=false; });
          }
        }
        dialog.addEventListener("submit", () => { primeLavaVoices(); if (session?.waiting) session.journey?.prime(); });

        function playLavaVoice(clip, words, owner) {
          clip.muted = false;
          clip.currentTime = 0;
          clip.play().catch(() => {
            if (session !== owner || !window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
            const voice = new SpeechSynthesisUtterance(words);
            voice.lang = "en-US"; voice.volume = 1;
            if (clip === warningVoice) { voice.pitch = 1.55; voice.rate = 1.06; }
            window.speechSynthesis.speak(voice);
          });
        }

        function addRoom(key, width, depth, x, y, asset) {
          const bounds = { left: 0, right: width, top: 0, bottom: depth };
          const area = { name: "", hint: "", bounds, spawn: { x, y, facing: 4 },
            art: { ...game.art, asset: asset || game.art.asset } };
          area.trialFloor = { rooms: [area], links: [], bounds };
          rooms[key] = area;
        }
        doors.forEach(gate => select.add(new Option(
          (gate.level.id === "dragon" ? "最終魔王 · " : "") + gate.level.name, gate.level.id)));
        select.onchange = () => { approachDoor(doors[select.selectedIndex - 1]); select.selectedIndex = 0; };
        document.getElementById("trialShortcut").onclick = () => {
          document.getElementById("gameSettings").open = false;
          returnHall(true);
        };
        leave.onclick = () => returnHall(false);
        read.onclick = openRule;
        dialog.addEventListener("close", () => {
          const action = dialogAction;
          dialogAction = null;
          if (dialog.returnValue === "confirm" && action) action();
        });
        dialog.addEventListener("cancel", event => {
          if (session?.won || session?.waiting) event.preventDefault();
          if (session?.waiting) { primeLavaVoices(); dialog.close("confirm"); }
          else if (session?.id==="lava" && session.timeLeft===0) {
            event.preventDefault();dialog.close("confirm");
          }
        });

        function showCard(title, text, button, action) {
          document.getElementById("trialTitle").textContent = title;
          document.getElementById("trialText").textContent = text;
          document.getElementById("trialConfirm").textContent = button;
          rulePicker.hidden = true;
          dialog.returnValue = "";
          dialogAction = action;
          dialog.showModal();
          dialog.querySelector(".scroll-content").scrollTop = 0;
          player.guard = false;
        }

        function syncControls() {
          clock.hidden = true;
          const hall = game.view() === rooms.corridor;
          const stage = !!game.view().trialFloor;
          control.hidden = !hall && !stage;
          control.classList.toggle("in-trial", stage);
          select.hidden = !hall;
          read.hidden = !stage || game.view() === rooms.dragonTrial;
          leave.hidden = !stage;
          if (hall) doors.forEach((gate, i) => {
            select.options[i + 1].text = (cleared.has(gate.level.id) ? "✓ " : "") +
              (gate.level.id === "dragon" ? "最終魔王 · " : "") + gate.level.name;
          });
        }

        function reset() {
          dialogAction = null;
          if (dialog.open) dialog.close();
          cleared.clear();
          visits.clear();
          if (hotVoice) hotVoice.pause();
          if (warningVoice) warningVoice.pause();
          session?.journey?.quiet();
          session?.arena?.quiet();
          approach = door = session = null;
        }

        function returnHall(atStart) {
          if (session?.arena && player.hp <= 0) player.hp = game.maxHp;
          const arrival = !atStart && door ? { x: 9.5, y: Math.floor(door.y) + .5, facing: 3 } : undefined;
          if (hotVoice) hotVoice.pause();
          if (warningVoice) warningVoice.pause();
          session?.journey?.quiet();
          session?.arena?.quiet();
          approach = door = session = null;
          enterRoom("corridor", arrival);
        }

        function approachDoor(gate) {
          if (!gate || game.view() !== rooms.corridor) return;
          game.stop();
          if (gate.level.id === "dragon") unlockBattleAudio();
          approach = gate;
          player.path = game.findPath(player.x, player.y, 8.5, gate.y);
        }

        function enterDoor(gate) {
          approach = null;
          const id = gate.level.id;
          return changeScene(async () => {
            const config = await loadScene(id);
            if (id === "dragon") await Promise.all([loadImages(config.assets), loadScene("dragon-weather"), loadScene("dragon-magma"), loadScene("dragon-fall")]);
            else {
              const [view] = await Promise.all([
                loadScene("trial-view"),
                loadImages(["scrollLectern","trialSlab","trialGate", ...config.assets])
              ]);
              if (!front) front = view(game, art, {paintPhotoTriangle, currentCojiFrames, cojiFrameForFacing, drawFrame, drawFootContact});
            }
            return config;
          }, config => {
            definition = config;
            const key = id === "dragon" ? "dragonTrial" : id === "lava" ? "lavaTrial" : "puzzleTrial";
            if (id !== "procession" && !rooms[key]) {
              if (id === "dragon") {
                addRoom(key,8,9,.5,4.5);
                rooms[key].frontView = true;
              }
              else {
                if (id === "lava") {
                  const entry = config.entrance;
                  addRoom(key,finishRow+config.landingLength,5,entry.spawn.x,entry.spawn.y);
                  // The masonry extends behind the camera. The spawn row is the last walkable row.
                  rooms[key].bounds.left = Math.floor(entry.spawn.x);
                } else addRoom(key,13,5,.5,2.5);
                rooms[key].frontView = true;
              }
            }
            startDoor(gate);
          });
        }

        function startDoor(gate) {
          door = gate;
          const id = door.level.id;
          if (id === "dragon") return startBoss();
          const visit = visits.get(id) || 0;
          visits.set(id, visit + 1);
          const rule = definition.rules[visit % definition.rules.length];
          session = { id, rule, waiting:true, light:0, section:0, timer:0, phase:"quiet", won:false,
            orderOffset:Math.floor(Math.random()*3) };
          if (id === "lava") {
            Object.assign(session, {entrance:definition.entrance, board:definition.createBoard(finishRow,rule), heat:0, melt:0, furnace:0,
              flight:0, timeLeft:definition.fixedSeconds, bannerTile:null, bannerDrop:0, landingEnd:finishRow+definition.landingLength, gateOpen:0, warned:false});
            if (!hotVoice) {
              hotVoice = new Audio("assets/coji-hot.mp3");
              warningVoice = new Audio("assets/floor-is-lava.mp3");
              hotVoice.preload = warningVoice.preload = "auto";
            }
          }
          if (id === "procession") {
            session.width=definition.width;
            session.journey=definition.create(session,game,({key,name,hint,assets},waiting,feedback)=>{
              if (!rooms[key]) {
                addRoom(key,13,session.width,.5,session.width/2);
                rooms[key].frontView=true;
                rooms[key].frontAssets=assets;
              }
              rooms[key].name=name;
              rooms[key].hint=waiting ? "Tap the scroll to read it." : hint;
              const owner=session;
              enterRoom(key,undefined,!waiting).then(()=>{
                if (feedback && session===owner && game.view()===rooms[key]) game.showMessage(feedback,3);
              });
            },win);
            session.journey.visit(0);
            return;
          }
          const key = id === "lava" ? "lavaTrial" : "puzzleTrial";
          rooms[key].name = door.level.name;
          rooms[key].hint = "Tap the scroll to read it.";
          enterRoom(key);
        }

        function scrollText() {
          return session.rule.text + (session.id==="lava" && !session.rule.banners ? " Reach the far shore before time runs out." : "");
        }

        function openRule() {
          if (!session?.rule || dialog.open || session.won || session.journey?.locked) return;
          if (session.waiting) {
            ruleSelect.replaceChildren(...definition.rules.map(rule => new Option(
              session.id==="lava" && !rule.banners ? rule.label+" · "+definition.fixedSeconds+"s" : rule.label)));
            ruleSelect.selectedIndex = definition.rules.indexOf(session.rule);
          }
          showCard(door.level.title, scrollText(), session.waiting ? "Begin" : "Continue", session.waiting ? () => {
            session.waiting = false;
            game.view().hint = roomHint.textContent = definition.hint;
          } : null);
          rulePicker.hidden = !session.waiting;
        }

        function win() {
          if (!session || session.won) return;
          session.won = true;
          game.stop();
          cleared.add(door.level.id);
          game.updateHud();
          showCard(door.level.title, session.id === "dragon" ? "You beat the dragon!" : "You did it!",
            "Back to the hall", () => returnHall(false));
        }

        function walkable(x, y) {
          const room = game.view();
          if (session?.journey) return session.journey.walkable(x);
          if (room === rooms.dragonTrial) return x < 2;
          return true;
        }

        function returnTo(point) {
          game.stop();
          player.x = point.x;
          player.y = point.y;
          game.addParticle(player.x, player.y, "magic", 10);
        }

        function tileAt(row, lane) {
          const slot = session.board[row]?.[lane];
          return slot >= 0 ? session.rule.tiles[slot] : "--";
        }

        function launchCoji(s) {
          game.stop();
          s.flight = .001;
        }

        function talkToKeeper(s) {
          game.stop();
          showCard("The Gatekeeper", "The Thunderfire Dragon waits beyond this gate. Watch for lightning, and raise your shield when it breathes fire.", "I’m ready", () => {
            s.warned = true;
            showMessage("The gate is open.");
            game.view().hint = roomHint.textContent = "Step through the gate.";
          });
        }

        function restartLava(s) {
          returnTo(game.view().spawn);
          player.facing = game.view().spawn.facing;
          game.view().hint = roomHint.textContent = definition.hint;
          Object.assign(s,{flight:0,timer:0,heat:0,melt:0,furnace:0,phase:"quiet",intent:null,
            timeLeft:definition.fixedSeconds,bannerTile:null,bannerDrop:0});
        }

        function updateLava(dt) {
          const s = session;
          if (s.flight) {
            const previousFlight = s.flight;
            s.flight += dt;
            // Let the eruption call land before Coji answers it on the way up.
            if (previousFlight < .93 && s.flight >= .93) {
              showMessage("HOT HOT HOT!!",1.45);
              playLavaVoice(hotVoice,"Hot! Hot! Hot!",s);
            }
            if (s.flight >= 1.45) restartLava(s);
            return;
          }
          if (s.warned) s.gateOpen = Math.min(1,s.gateOpen + dt*1.3);
          if (player.x >= finishRow) {
            if (!s.onLanding) {
              s.onLanding = true;
              game.view().hint = roomHint.textContent = s.warned ? "Step through the gate." : "Speak to the gatekeeper.";
            }
            s.bannerDrop = 0; s.bannerTile = null;
            s.timer = 0; s.heat = s.melt = 0; s.furnace = 0; s.phase = "quiet";
            if (!s.warned && s.intent === "keeper" && Math.hypot(player.x-(finishRow+3.5),player.y-1.5) <= 1.8) {
              s.intent = null;
              talkToKeeper(s);
            } else if (s.gateOpen >= 1 && player.x >= s.landingEnd-1.1 && Math.abs(player.y-2.5) < .9) {
              cleared.add("lava"); returnHall(false);
            }
            return;
          }
          if (s.onLanding) {
            s.onLanding = false;
            game.view().hint = roomHint.textContent = definition.hint;
          }
          const {warningStart,eruptionStart,eruptionEnd,coolingDuration} = definition;
          const previous = s.phase;
          const cycle=eruptionEnd+coolingDuration;
          const next=s.timer+dt;
          if (!s.rule.banners) {
            // Charge only time in which the player can steer, splitting a tick at either boundary.
            const walking=Math.max(0,Math.min(next,eruptionStart)-s.timer)+Math.max(0,next-cycle);
            s.timeLeft=Math.max(0,s.timeLeft-walking);
            if (!s.timeLeft) {
              game.stop();
              showCard("Time’s up", "The stones have cooled. Try the crossing again.", "Try again", () => restartLava(s));
              return;
            }
          }
          const reveal=eruptionStart-definition.bannerLead;
          if (s.rule.banners && s.timer<reveal && next>=reveal) {
            const marks=s.rule.tiles.filter(mark=>mark!==s.bannerTile);
            s.bannerTile=marks[Math.floor(Math.random()*marks.length)];
          }
          s.timer = next % cycle;
          s.bannerDrop = s.rule.banners && s.timer>=reveal
            ? Math.max(0,Math.min(1,(s.timer-reveal)/.28,(cycle-s.timer)/.55)) : 0;
          if (s.timer < warningStart) s.phase = "quiet";
          else if (s.timer < eruptionStart) s.phase = "warning";
          else if (s.timer < eruptionEnd) s.phase = "hot";
          else s.phase = "cooling";

          const remaining = Math.max(0,Math.min(1,1-(s.timer-eruptionEnd)/coolingDuration));
          s.melt = s.phase === "hot" || s.phase === "cooling" ? remaining*remaining*(3-2*remaining) : 0;
          s.heat = s.phase === "warning" ? (s.timer-warningStart)/(eruptionStart-warningStart) : s.melt;
          // The furnace keeps intensifying into the first second of the eruption.
          const warmth = Math.max(0,Math.min(1,(s.timer-warningStart)/(eruptionStart+1-warningStart)));
          s.furnace = warmth*warmth*(3-2*warmth)*s.heat;
          if (previous !== s.phase) {
            roomHint.textContent = movementLocked() ? "Wait for the stone to cool." : definition.hint;
            if (s.phase === "hot") {
              playLavaVoice(warningVoice,"Floor is lava!",s);
              showMessage("Floor is lava!",1.65);
            }
          }
          if (movementLocked()) player.moving = false;
          if (s.phase === "hot") {
            const row = Math.floor(player.x);
            if (row >= s.entrance.end && !s.rule.safe(tileAt(row,Math.floor(player.y)),s.bannerTile)) launchCoji(s);
          }
        }

        function tokens() {
          const s = session;
          if (s.id === "eye") return [{ type: "eye", x: 11.5, y: 2.5, closed: eyeClosed() }];
          return s.journey?.objects() || [];
        }

        function eyeClosed() { return session.timer % 5 < 3.1; }
        function updateEye(dt) {
          const s = session;
          s.timer += dt;
          if (player.moving && eyeClosed() !== s.rule.closed) {
            returnTo({ x: .5 + s.section * 3, y: 2.5 });
            showMessage("Watch the eye!");
          } else if (player.x >= .5 + (s.section + 1) * 3) {
            if (++s.section === 3) win();
          }
        }

        function startBoss() {
          session?.arena?.quiet();
          const arena = definition.create(game, art.sprite, () => battleAudio, win, startBoss);
          session = {id:"dragon", arena, dragon:arena.dragon, won:false};
          rooms.dragonTrial.name = "王座裂谷";
          rooms.dragonTrial.hint = definition.hint;
          player.hp = game.maxHp;
          enterRoom("dragonTrial");
        }

        function update(dt) {
          if (approach && !player.path.length) {
            if (game.view() === rooms.corridor && Math.hypot(player.x - 8.5, player.y - approach.y) < 1.1) enterDoor(approach);
            approach = null;
          }
          if (!session || session.won || session.waiting) return;
          if (game.view().frontView && !session.arena) session.light = Math.min(1, session.light + dt * 1.5);
          if (session.id === "lava") updateLava(dt);
          else if (session.journey) session.journey.update(dt);
          else if (session.id === "eye") updateEye(dt);
          else if (session.arena) session.arena.update(dt);
        }

        function objects() {
          const room = game.view();
          if (room === rooms.corridor) return doors;
          return [];
        }

        function movementLocked() {
          return session?.arena?.terminal() || session?.journey?.locked || session?.id === "lava" && (session.flight || session.phase === "hot" || session.phase === "cooling");
        }

        function click(pos, shoot, event) {
          if (session?.arena) {
            const {arena, dragon} = session;
            if (session.won || arena.terminal() || dialog.open || pointerGuard !== false) return true;
            unlockBattleAudio();
            const offset = arena.cameraOffset();
            pos = {x:pos.x-offset.x, y:pos.y-offset.y};
            if (arena.hitHero(pos)) {
              castState = null;
              player.facing = 4;
              beginGuard(event,pos);
            } else if (!castState && arena.hitDragon(pos)) {
              shoot(dragon,pos);
            } else if (!castState) {
              const point = arena.ground(pos);
              if (point) {
                player.path = [point];
                targetMarker = {...point, life:1};
              }
            }
            return true;
          }
          if (game.view().frontView) {
            if (session.won || dialog.open) return true;
            const lava = session.id === "lava";
            if (movementLocked()) return true;
            const target = front.hit(pos);
            if (lava) session.intent = null;
            session.journey?.cancel();
            if (session.waiting) { if (target?.type === "scroll") openRule(); }
            else if (target?.type === "coji") game.stop();
            else if (lava && target?.type === "keeper" && player.x >= finishRow-1) {
              if (!session.warned) {
                session.intent = "keeper";
                player.path = game.findPath(player.x,player.y,finishRow+2.5,1.5);
              }
            } else if (session.journey && target) session.journey.choose(target);
            else {
              let point = front.ground(pos);
              if (target?.type === "eye") point = {x:10.5,y:2.5};
              if (target?.type === "exit") {
                if (!session.warned && player.x >= finishRow) {
                  showMessage("Speak to the gatekeeper.");
                  return true;
                }
                point = {x:session.warned ? session.landingEnd-.5 : finishRow+.5,y:2.5};
              }
              if (point && inside(game.view().bounds,point.x,point.y)) {
                if (!session.journey?.ground(point)) player.path = game.findPath(player.x,player.y,point.x,point.y);
              }
            }
            return true;
          }
          const hits = objects().filter(item => art.hit(item, pos));
          const item = hits.sort((a, b) => b.x + b.y - a.x - a.y)[0];
          if (!item) return false;
          if (item.type === "gate") approachDoor(item);
          return true;
        }

        function renderFront() {
          if (!game.view().frontView) return false;
          if (session.arena) {
            ctx.save();
            const offset = session.arena.cameraOffset();
            ctx.translate(offset.x,offset.y);
            session.arena.draw();
            drawTargetMarker();
            drawRealisticCoji();
            projectiles.forEach(drawProjectile);
            if (showFx) drawParticles(game.view());
            session.arena.shadeForeground();
            session.arena.drawImpactDebris();
            drawWorldMessages();
            ctx.restore();
            return true;
          }
          const head=front.draw(session,tileAt,finishRow,session.id==="lava" ? [] : tokens());
          clock.hidden = session.id!=="lava" || session.waiting || session.rule.banners || session.onLanding || !!session.flight;
          if (!clock.hidden) {
            const seconds=Math.ceil(session.timeLeft);
            const label=String(seconds);
            if (clock.textContent!==label) clock.textContent=label;
            clock.style.left=head.x+"px"; clock.style.top=(head.y-5)+"px";
            clock.classList.toggle("urgent",seconds<=10);
          }
          return true;
        }

        return { objects, click, update, walkable, syncControls, reset, renderFront,
          drawObject: item => art.object(item, cleared),
          movementLocked,
          paused: () => dialog.open, cancelApproach: () => { approach = null; },
          arena: () => session?.arena, boss: () => session?.dragon,
          orbDamage: target => target === session?.dragon && session.arena.vulnerable() ? 2 : 1
        };
      }

      function key(x, y) { return x + "," + y; }

      function addProp(type, x, y, options) {
        var prop = Object.assign({ type: type, x: x, y: y, block: true, height: 1 }, options || {});
        props.push(prop);
        if (prop.block) blocked.add(key(Math.floor(x), Math.floor(y)));
      }

      function addWallLamps(area) {
        var bounds = area.bounds;
        var spacing = (bounds.right - bounds.left) / 4;
        var rearDoor = floor.links.find(function (link) { return link.axis === "y" && link.after === area; });
        var rearLamps = Array.from({ length: 4 }, function (_, index) {
          return [bounds.left + (index + .5) * spacing, bounds.top + 1.9];
        });
        rearLamps.forEach(function ([x, y]) {
          if (rearDoor && x >= rearDoor.start - 2.7 && x <= rearDoor.end + 2.7) return;
          if (area.statueFootprint && pointInPolygon(x, y, area.statueFootprint)) return;
          addProp("lamp", x - .5, y - .5, { area: area, block: false });
        });
        var entrance = floor.links.find(function (link) { return link.axis === "x" && link.after === area; });
        if (entrance || area === rooms.cellar) {
          var mid = entrance ? openingCenter(entrance) : area.exit.approach.y;
          for (var offset of [-4.8, 4.8]) {
            addProp("lamp", bounds.left + 1.4, mid + offset - .5, { area: area, block: false });
          }
        }
      }

      function exteriorEdges(area, axis) {
        var bounds = area.bounds;
        var xWall = axis === "x";
        var at = xWall ? bounds.right : bounds.bottom;
        var spans = [[xWall ? bounds.top : bounds.left, xWall ? bounds.bottom : bounds.right]];
        floor.rooms.forEach(function (other) {
          var neighbor = other.bounds;
          if ((xWall ? neighbor.left : neighbor.top) !== at) return;
          var start = xWall ? neighbor.top : neighbor.left;
          var end = xWall ? neighbor.bottom : neighbor.right;
          spans = spans.flatMap(function (span) {
            if (start >= span[1] || end <= span[0]) return [span];
            var remaining = [];
            if (start > span[0]) remaining.push([span[0], start]);
            if (end < span[1]) remaining.push([end, span[1]]);
            return remaining;
          });
        });
        var face = { axis: axis, at: at, start: xWall ? bounds.top : bounds.left, end: xWall ? bounds.bottom : bounds.right };
        return spans.map(function (span) {
          return { area: area, face: face, axis: axis, at: at, start: span[0], end: span[1] };
        });
      }

      function exteriorWallOccludesRoom(wall, area) {
        var bounds = area.bounds;
        var xWall = wall.axis === "x";
        // Projecting a point at height z onto the floor moves both coordinates back by z / TILE_H.
        var first = Math.max(0, wall.at - (xWall ? bounds.right : bounds.bottom),
          wall.start - (xWall ? bounds.bottom : bounds.right));
        var last = Math.min(wallHeight() / TILE_H, wall.at - (xWall ? bounds.left : bounds.top),
          wall.end - (xWall ? bounds.top : bounds.left));
        return first < last;
      }

      function buildWorld() {
        blocked.clear();
        props.length = 0;
        assets.roomScenery.clear();
        if (room.frontView) {
          assets.wallFaces.clear();
          assets.exteriorWalls = [];
          return;
        }
        activeAreas = nearbyRooms(room,floor);
        prepareRoomGeometry();
        assets.exteriorWalls = activeAreas.flatMap(function (area) {
          return exteriorEdges(area, "x").concat(exteriorEdges(area, "y"));
        });
        activeAreas.forEach(function (area) {
          if (!assets[area.art.asset]) {
            (area.pillars || []).forEach(function (point) {
              addProp("pillar", point[0], point[1], { height: 1.35 });
            });
            (area.rubble || []).forEach(function (point) {
              addProp("rubble", point[0], point[1], { block: false });
            });
          }
          var scenery = buildRoomScenery(area);
          scenery.occludingExteriorFaces = new Set(assets.exteriorWalls.filter(function (wall) {
            return wall.area !== area && exteriorWallOccludesRoom(wall, area);
          }).map(function (wall) { return wall.face; }));
          assets.roomScenery.set(area, scenery);
          if (area.treasure) blocked.add(key(Math.floor(area.treasure.x), Math.floor(area.treasure.y)));
          addWallLamps(area);
        });
        var floorJoints = floor.links.filter(link => activeAreas.includes(link.before) && activeAreas.includes(link.after)).flatMap(buildFloorJoint);
        assets.wallFaces.clear();
        activeAreas.forEach(function (area) {
          var scenery = assets.roomScenery.get(area);
          var joints = floorJoints.filter(function (joint) { return joint.area === area; });
          var lamps = props.filter(function (prop) { return prop.area === area && prop.type === "lamp"; }).map(buildLampLayer);
          scenery.back = [scenery].concat(joints, scenery.walls);
          scenery.fixtures = lamps.concat(scenery.statue || []).map(function (layer) {
            return { type: "fixture", depth: layer.depth / (TILE_H * .5), item: layer };
          });
          scenery.front = assets.exteriorWalls.filter(wall => wall.area === area).map(buildExteriorWall);
          scenery.walls.concat(scenery.front).forEach(layer => assets.wallFaces.add(layer.face));
        });
      }

      function hash(x, y, salt) {
        var n = Math.sin(x * 127.1 + y * 311.7 + salt * 74.7) * 43758.5453;
        return n - Math.floor(n);
      }

      function makeAssetCanvas(width, height) {
        var c = document.createElement("canvas");
        c.width = width;
        c.height = height;
        return { canvas: c, ctx: c.getContext("2d") };
      }

      function buildFallbackGrain() {
        var grainMade = makeAssetCanvas(256, 256);
        var gg = grainMade.ctx;
        for (var n = 0; n < 3800; n++) {
          var shade = 90 + Math.floor(hash(n, 2, 66) * 150);
          gg.fillStyle = "rgba(" + shade + "," + shade + "," + shade + "," + (.025 + hash(n, 3, 67) * .08) + ")";
          gg.fillRect(hash(n, 4, 68) * 256, hash(n, 5, 69) * 256, 1, 1);
        }
        assets.grain = grainMade.canvas;
      }

      function sceneryPolygon(g, points) {
        g.beginPath();
        g.moveTo(points[0].x, points[0].y);
        for (var i = 1; i < points.length; i++) g.lineTo(points[i].x, points[i].y);
        g.closePath();
      }

      function floorQuad(left, top, right, bottom, z) {
        return [rawIso(left, top, z), rawIso(right, top, z),
          rawIso(right, bottom, z), rawIso(left, bottom, z)];
      }

      function drawStoneWall(g, start, end, height, shade) {
        var length = Math.abs(end.x - start.x);
        g.save();
        g.translate(start.x, start.y);
        g.transform((end.x - start.x) / length, (end.y - start.y) / length, 0, 1, 0, 0);
        g.beginPath();
        g.rect(0, -height, length, height);
        g.clip();
        g.fillStyle = "#333638";
        g.fillRect(0, -height, length, height);
        if (assets.stone) {
          for (var x = 0; x < length; x += 240) {
            g.drawImage(assets.stone, x, -height, 240, Math.max(102, height));
          }
        }
        var stoneShade = g.createLinearGradient(0, -height, 0, 0);
        stoneShade.addColorStop(0, "rgba(19,18,24," + shade + ")");
        stoneShade.addColorStop(.68, "rgba(16,15,21," + (shade - .08) + ")");
        stoneShade.addColorStop(1, "rgba(10,8,12,.88)");
        g.fillStyle = stoneShade;
        g.fillRect(0, -height, length, height);
        g.fillStyle = "rgba(194,183,168,.24)";
        g.fillRect(0, -height, length, 2);
        g.fillStyle = "rgba(7,7,9,.66)";
        g.fillRect(0, -7, length, 7);
        g.restore();
      }

      function traceArch(g, width, height) {
        var radius = width * .5;
        g.moveTo(-radius, 0);
        g.lineTo(-radius, -height + radius);
        g.arc(0, -height + radius, radius, Math.PI, 0);
        g.lineTo(radius, 0);
        g.closePath();
      }

      function archOutline(g, width, height) {
        g.beginPath();
        traceArch(g, width, height);
      }

      function drawWallOpening(g, point, windowOpening, openThrough, axis, doorWidth = 86) {
        var width = windowOpening ? 42 : doorWidth;
        var height = windowOpening ? 104 : 137;
        g.save();
        g.translate(point.x, point.y);
        g.transform(1, windowOpening || axis === "y" ? .5 : -.5, 0, 1, 0, 0);
        archOutline(g, width + 26, height + 13);
        var border = g.createLinearGradient(-width, -height, width, 0);
        border.addColorStop(0, "#726a61");
        border.addColorStop(1, "#333036");
        g.fillStyle = border;
        g.fill();
        g.strokeStyle = "#18161a";
        g.lineWidth = 2;
        g.stroke();
        archOutline(g, width, height);
        if (openThrough) {
          g.globalCompositeOperation = "destination-out";
          g.fill();
          g.restore();
          return;
        }
        var recess = g.createLinearGradient(0, -height, 0, 0);
        recess.addColorStop(0, windowOpening ? "#283846" : "#08060b");
        recess.addColorStop(1, windowOpening ? "#6f8b9d" : "#19151b");
        g.fillStyle = recess;
        g.fill();
        g.strokeStyle = "#151319";
        g.stroke();

        for (var y = -18; y > -height + width * .52; y -= 23) {
          g.beginPath();
          g.moveTo(-width * .5 - 13, y);
          g.lineTo(-width * .5, y);
          g.moveTo(width * .5, y);
          g.lineTo(width * .5 + 13, y);
          g.stroke();
        }
        if (windowOpening) {
          g.fillStyle = "#22272d";
          g.fillRect(-2, -height + 9, 4, height - 9);
          g.fillRect(-width * .5, -height * .48, width, 4);
        } else {
          g.fillStyle = "#29242a";
          g.fillRect(-width * .5, -9, width, 9);
          g.fillStyle = "#53463c";
          g.fillRect(-width * .5, -2, width, 4);
          g.fillStyle = "rgba(148,111,74,.14)";
          g.fillRect(-width * .39, -23, width * .78, 2);
        }
        g.restore();
      }

      function drawStairwell(g, well, depth) {
        var corners = floorQuad(well.left, well.top, well.right, well.bottom, 0);
        sceneryPolygon(g, corners);
        g.fillStyle = "#09080a";
        g.fill();
        g.strokeStyle = "#747066";
        g.lineWidth = 5;
        g.stroke();

        g.save();
        g.clip();
        var steps = 10;
        var run = (well.right - well.left) / steps;
        var drop = depth / steps;
        for (var step = steps - 1; step >= 0; step--) {
          var near = well.right - step * run;
          var far = near - run;
          var z = -step * drop;
          var depth = 1 - step / steps;
          sceneryPolygon(g, floorQuad(far, well.top + .14, near, well.bottom - .14, z));
          g.fillStyle = "hsl(31 11% " + (14 + depth * 19) + "%)";
          g.fill();
          g.strokeStyle = "rgba(13,11,14,.85)";
          g.lineWidth = 1.5;
          g.stroke();
          sceneryPolygon(g, [rawIso(far, well.top + .14, z), rawIso(far, well.bottom - .14, z),
            rawIso(far, well.bottom - .14, z - drop), rawIso(far, well.top + .14, z - drop)]);
          g.fillStyle = "hsl(26 9% " + (9 + depth * 12) + "%)";
          g.fill();
        }
        g.restore();

        g.strokeStyle = "#726d65";
        g.lineWidth = 4;
        for (var rail of [well.top, well.bottom]) {
          var end = rawIso(well.left, rail, 0);
          var start = rawIso(well.right, rail, 0);
          g.beginPath();
          g.moveTo(start.x, start.y);
          g.lineTo(end.x, end.y);
          g.stroke();
        }
      }

      function drawStoneFloor(g, bounds) {
        g.save();
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.fillStyle = "#303038";
        g.fillRect(0, 0, g.canvas.width, g.canvas.height);
        g.restore();
        if (assets.stone) {
          g.save();
          g.transform(TILE_W * .5, TILE_H * .5, -TILE_W * .5, TILE_H * .5, 0, 0);
          var repeat = 5;
          for (var y = bounds.top; y < bounds.bottom; y += repeat) {
            for (var x = bounds.left; x < bounds.right; x += repeat) {
              g.drawImage(assets.stone, x, y, repeat, repeat);
            }
          }
          g.restore();
        }
      }

      function drawFoundations(g, area, depth) {
        assets.exteriorWalls.forEach(function (wall) {
          if (wall.area !== area) return;
          var start = rawWallPoint(wall, wall.start, -depth);
          var end = rawWallPoint(wall, wall.end, -depth);
          drawStoneWall(g, start, end, depth, .70);
        });
      }

      function wallHeight() {
        return floor === upperFloor ? 462 : 318;
      }

      function mixPoint(a, b, t) {
        return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
      }

      function photoPoint(pair) {
        return { x: pair[0], y: pair[1] };
      }

      function surfaceTriangles(source, world, strips = 1) {
        var triangles = [];
        for (var i = 0; i < strips; i++) {
          var from = i / strips;
          var to = (i + 1) / strips;
          var src = [mixPoint(source[0], source[1], from), mixPoint(source[0], source[1], to),
            mixPoint(source[3], source[2], to), mixPoint(source[3], source[2], from)];
          var dst = [mixPoint(world[0], world[1], from), mixPoint(world[0], world[1], to),
            mixPoint(world[3], world[2], to), mixPoint(world[3], world[2], from)];
          for (var indices of [[0, 1, 2], [0, 2, 3]]) {
            triangles.push({ photo: indices.map(function (j) { return src[j]; }),
              world: indices.map(function (j) { return dst[j]; }) });
          }
        }
        return triangles;
      }

      function pointOnSurface(triangles, point, inverse) {
        for (var triangle of triangles) {
          var from = inverse ? triangle.world : triangle.photo;
          var to = inverse ? triangle.photo : triangle.world;
          var ax = from[1].x - from[0].x;
          var ay = from[1].y - from[0].y;
          var bx = from[2].x - from[0].x;
          var by = from[2].y - from[0].y;
          var px = point.x - from[0].x;
          var py = point.y - from[0].y;
          var determinant = ax * by - ay * bx;
          var u = (px * by - py * bx) / determinant;
          var v = (ax * py - ay * px) / determinant;
          if (u < -.0001 || v < -.0001 || u + v > 1.0001) continue;
          return { x: to[0].x + u * (to[1].x - to[0].x) + v * (to[2].x - to[0].x),
            y: to[0].y + u * (to[1].y - to[0].y) + v * (to[2].y - to[0].y) };
        }
        return null;
      }

      function paintPhotoTriangle(g, image, triangle) {
        var s = triangle.photo;
        var d = triangle.world;
        var sx1 = s[1].x - s[0].x, sy1 = s[1].y - s[0].y;
        var sx2 = s[2].x - s[0].x, sy2 = s[2].y - s[0].y;
        var dx1 = d[1].x - d[0].x, dy1 = d[1].y - d[0].y;
        var dx2 = d[2].x - d[0].x, dy2 = d[2].y - d[0].y;
        var determinant = sx1 * sy2 - sy1 * sx2;
        var a = (dx1 * sy2 - dx2 * sy1) / determinant;
        var b = (dy1 * sy2 - dy2 * sy1) / determinant;
        var c = (dx2 * sx1 - dx1 * sx2) / determinant;
        var e = (dy2 * sx1 - dy1 * sx2) / determinant;
        var side0 = Math.hypot(dx2 - dx1, dy2 - dy1);
        var side1 = Math.hypot(dx2, dy2);
        var side2 = Math.hypot(dx1, dy1);
        var perimeter = side0 + side1 + side2;
        var center = { x: (d[0].x * side0 + d[1].x * side1 + d[2].x * side2) / perimeter,
          y: (d[0].y * side0 + d[1].y * side1 + d[2].y * side2) / perimeter };
        var padding = perimeter / Math.abs(dx1 * dy2 - dy1 * dx2);
        g.save();
        // Give every edge one pixel of overlap, even on narrow wall sections.
        sceneryPolygon(g, d.map(function (p) {
          return mixPoint(p, center, -padding);
        }));
        g.clip();
        g.transform(a, b, c, e, d[0].x - a * s[0].x - c * s[0].y, d[0].y - b * s[0].x - e * s[0].y);
        g.drawImage(image, 0, 0);
        g.restore();
      }

      function paintPhotoSurface(g, image, surface) {
        g.save();
        sceneryPolygon(g, surface.world);
        g.clip();
        surface.triangles.forEach(function (triangle) { paintPhotoTriangle(g, image, triangle); });
        g.restore();
      }

      function photoRoofline(art) {
        var peak = art.outline[1];
        function estimate(x) {
          var corner = art.outline[x < peak[0] ? 0 : 2];
          return peak[1] + (corner[1] - peak[1]) * (x - peak[0]) / (corner[0] - peak[0]);
        }

        const offsets = (floor.roofOffsets || lowerFloor.roofOffsets)[art.asset];
        if (!offsets) return estimate;
        const roof = {left:art.outline[0][0], right:art.outline[2][0], offsets};
        return function (x) {
          var index = (x - roof.left) / (roof.right - roof.left) * (roof.offsets.length - 1);
          index = Math.max(0, Math.min(roof.offsets.length - 1, index));
          var i = Math.floor(index);
          var a = roof.offsets[i];
          var b = roof.offsets[Math.min(i + 1, roof.offsets.length - 1)];
          return estimate(x) + a + (b - a) * (index - i);
        };
      }

      function profileAxis(profile) {
        var first = profile[0].x;
        var span = profile[profile.length - 1].x - first;
        return profile.map(function (point) { return (point.x - first) / span; });
      }

      function sampleProfile(profile, positions, t) {
        for (var i = 1; i < positions.length; i++) {
          if (t <= positions[i]) return mixPoint(profile[i - 1], profile[i],
            (t - positions[i - 1]) / (positions[i] - positions[i - 1]));
        }
        return profile[profile.length - 1];
      }

      function floorMesh(photo, world, walls) {
        var top = walls[1].contact;
        var left = walls[0].contact.slice().reverse();
        var us = profileAxis(top);

      function photoFloorPoint(area, point) {
        var mapped = pointOnSurface(area.geometry.floor.triangles, photoPoint(point), false);
        return rawToWorld(mapped.x, mapped.y);
      }

      function prepareRoomGeometry() {
        floor.rooms.forEach(function (area) { area.geometry = roomGeometry(area); });
        floor.links.forEach(function (link) {
          var wall = link.after.geometry.walls.find(function (wall) { return wall.face.axis === link.axis; });
          var bounds = link.jambs.map(wall.along);
          link.start = Math.min(...bounds);
          link.end = Math.max(...bounds);
          link.wall = wall;
        });
        if (floor === upperFloor) {
          var hall = rooms.hall;
          var exit = hall.exit;
          exit.footprint = hall.art.stairCorners.map(function (p) { return photoFloorPoint(hall, p); });
          var p = exit.footprint;
          exit.well = { left: (p[0].x + p[3].x) * .5, right: (p[1].x + p[2].x) * .5,
            top: (p[0].y + p[1].y) * .5, bottom: (p[2].y + p[3].y) * .5 };
          var y = (exit.well.top + exit.well.bottom) * .5;
          exit.approach = { x: Math.ceil(Math.max(p[1].x, p[2].x)) + .5, y: Math.floor(y) + .5 };
          exit.destination = { x: exit.well.left + .15, y: exit.approach.y, z: -167 };
          Object.assign(rooms.cellar.exit.arrival, exit.approach);
        } else if (floor === lowerFloor) {
          var cellar = rooms.cellar;
          var stairWall = cellar.geometry.walls[0];
          var stairY = Math.floor(stairWall.along((cellar.art.stairJambs[0] + cellar.art.stairJambs[1]) * .5)) + .5;
          cellar.exit.approach.y = stairY;
          cellar.exit.destination.y = stairY;
          cellar.spawn.y = stairY;
        }
      }

      function makeSurfaceCanvas(points, padding = 1) {
        var xs = points.map(function (point) { return point.x; });
        var ys = points.map(function (point) { return point.y; });
        var x = Math.floor(Math.min(...xs)) - padding;
        var y = Math.floor(Math.min(...ys)) - padding;
        var made = makeAssetCanvas(Math.ceil(Math.max(...xs)) - x + padding, Math.ceil(Math.max(...ys)) - y + padding);
        made.ctx.translate(-x, -y);
        return { canvas: made.canvas, ctx: made.ctx, x: x, y: y };
      }

      function fillRoomFloor(g, area, corners) {
        g.save();
        sceneryPolygon(g, corners);
        var footprint = area.exit && area.exit.footprint;
        if (footprint) {
          var well = footprint.map(function (p) { return rawIso(p.x, p.y, 0); });
          g.moveTo(well[0].x, well[0].y);
          well.slice(1).forEach(function (point) { g.lineTo(point.x, point.y); });
          g.closePath();
        }
        g.clip("evenodd");
        drawStoneFloor(g, area.bounds);
        g.restore();
      }

      function buildFloorJoint(link) {
        var before = assets.roomScenery.get(link.before);
        var after = assets.roomScenery.get(link.after);
        if (!before.hasArtwork || !after.hasArtwork) return [];

        var xWall = link.axis === "x";
        var a = link.before.bounds;
        var b = link.after.bounds;
        var start = Math.max(xWall ? a.top : a.left, xWall ? b.top : b.left);
        var end = Math.min(xWall ? a.bottom : a.right, xWall ? b.bottom : b.right);
        var width = 1.25;
        var from = link.at - width;
        var to = link.at + width;
        var rect = xWall ? [from, start, to - from, end - start] : [start, from, end - start, to - from];
        var corners = floorQuad(rect[0], rect[1], rect[0] + rect[2], rect[1] + rect[3], 0);
        var joint = makeSurfaceCanvas(corners);
        var overlay = makeSurfaceCanvas(corners);
        // Sample inward of each room's baked rim and project both textures across the seam.
        var shift = xWall ? rawIso(1.85, 0, 0) : rawIso(0, 1.85, 0);
        joint.ctx.drawImage(before.canvas, before.x + shift.x, before.y + shift.y);
        overlay.ctx.drawImage(after.canvas, after.x - shift.x, after.y - shift.y);

        function mask(g, axis, first, last, stops) {
          g.save();
          g.globalCompositeOperation = "destination-in";
          g.transform(TILE_W * .5, TILE_H * .5, -TILE_W * .5, TILE_H * .5, 0, 0);
          var gradient = axis === "x" ? g.createLinearGradient(first, 0, last, 0) :
            g.createLinearGradient(0, first, 0, last);

        joint.ctx.drawImage(overlay.canvas, overlay.x, overlay.y);
        mask(joint.ctx, link.axis, from, to, [[0, 0], [.28, 1], [.72, 1], [1, 0]]);

      function buildRoomScenery(area) {
        var geometry = area.geometry;
        var depth = floor === upperFloor ? 34 : 26;
        var points = geometry.corners.concat(geometry.corners.map(function (point) {
          return { x: point.x, y: point.y + depth };
        }));
        var scenery = makeSurfaceCanvas(points);
        var g = scenery.ctx;
        var artwork = assets[area.art.asset];
        drawFoundations(g, area, depth);
        fillRoomFloor(g, area, geometry.corners);
        if (artwork) {
          var source = makeAssetCanvas(artwork.naturalWidth, artwork.naturalHeight);
          source.ctx.drawImage(artwork, 0, 0);
          var photoStatue = area.art.statue;
          if (photoStatue) {
            var cutout = makeAssetCanvas(source.canvas.width, source.canvas.height);
            var outline = new Path2D(photoStatue.outline);
            cutout.ctx.clip(outline);
            cutout.ctx.drawImage(artwork, 0, 0);
            var bases = photoStatue.footprint.map(function (point) { return photoFloorPoint(area, point); });

            area.statueFootprint = [bases[0], { x: bases[1].x, y: area.bounds.top },
              { x: bases[2].x, y: area.bounds.top }, bases[3]];
            var statueFoot = bases.reduce(function (sum, p) { return sum + rawIso(p.x, p.y, 0).y; }, 0) / bases.length;

            scenery.statue.depth = statueFoot;

      }

      function rebuildSpriteCaches() {
        if (!canvas._h) return;
        const cojiHeight = trials?.arena()?.heroSize() ?? Math.max(109, Math.min(143, canvas._h * .2025));

            return frame;

        }
        assets.cojiIdleFrames = frames("cojiIdle", cojiHeight);
        assets.cojiGuardFrames = frames("cojiGuard", cojiHeight);
        assets.cojiCastFrames = frames("cojiCast", cojiHeight);

        assets.cojiWalkFrames = [];
        for (let i=0; i<poses.length; i+=5) {

          [0,4,5,6,7].forEach((direction,j) => { row[direction] = poses[i+j]; });
          assets.cojiWalkFrames.push(row);

        assets.impFrames = frames("imp",impHeight);
        assets.impFramesB = frames("impWalkB",impHeight);

      // Tint only opaque pixels in the support band. This keeps the contact shadow under
      // each foot or pedestal leg, including for atlases loaded directly over file://.
      function drawFootContact(g,image,x,y,w,h,frame) {
        const sx=frame?.x ?? 0, sy=frame?.y ?? 0, sw=frame?.w ?? image.width, sh=frame?.h ?? image.height;
        const key=sx+","+sy+","+sw+","+sh;
        let regions=contactMasks.get(image);
        if (!regions) {regions=new Map();contactMasks.set(image,regions);}
        let mask=regions.get(key);
        const band=.16;
        if (!mask) {
          mask=document.createElement("canvas");
          mask.width=Math.min(216,sw);
          mask.height=Math.max(4,Math.ceil(mask.width*sh/sw*band));
          const m=mask.getContext("2d");
          m.drawImage(image,sx,sy+sh*(1-band),sw,sh*band,0,0,mask.width,mask.height);

      function drawFrame(frame,x,y,w,h) {
        ctx.drawImage(frame.image,frame.x,frame.y,frame.w,frame.h,x,y,w,h);
      }

      function buildFogSprite() {
        if (!assets.fogSprite) {
          var made = makeAssetCanvas(320, 144);
          var fog = made.ctx.createRadialGradient(160, 72, 8, 160, 72, 150);
          fog.addColorStop(0, "rgba(180,189,205,.12)");
          fog.addColorStop(.55, "rgba(164,173,191,.055)");
          fog.addColorStop(1, "rgba(150,160,180,0)");
          made.ctx.fillStyle = fog;
          made.ctx.fillRect(0, 0, 320, 144);
          assets.fogSprite = made.canvas;

        if (!assets.lampGlowSprite) {
          var fireMade = makeAssetCanvas(256, 256);

          fire.addColorStop(0, "rgba(255,231,165,.9)");
          fire.addColorStop(.22, "rgba(255,174,72,.58)");

          windowGlow.addColorStop(0, "rgba(235,250,255,.96)");
          windowGlow.addColorStop(.24, "rgba(166,220,255,.68)");
