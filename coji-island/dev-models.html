<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Model viewer</title>
    <!-- Dev tool (not part of the game): shows each model in its own tile, lit like the game, with its
         triangle and draw-call cost. Use: dev-models.html?set=props|characters|plants&only=a,b&yaw=0.6&pitch=0.3&cols=3 -->
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" } }
    </script>
    <style>
      html, body { margin: 0; background: #cfe3f3; font: 12px/1.3 system-ui, sans-serif; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
      .lbl { position: fixed; background: #fffd; padding: 2px 5px; border-radius: 4px; pointer-events: none; }
      #err { position: fixed; right: 6px; top: 6px; color: #b00; background: #fffe; white-space: pre; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="err"></div>
    <script type="module">
      import * as THREE from 'three'
      import { SUN_DIR, skyEnvironment } from './js/env.js'
      const q = new URLSearchParams(location.search)
      const set = q.get('set') || 'props'
      const only = q.get('only') ? q.get('only').split(',') : null
      const yaw = +(q.get('yaw') ?? 0.6)
      const pitch = +(q.get('pitch') ?? 0.3)
      const zoom = +(q.get('zoom') ?? 1)
      const errs = []

      const canvas = document.getElementById('c')
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true })
      renderer.outputColorSpace = THREE.SRGBColorSpace
      renderer.toneMapping = THREE.NeutralToneMapping
      renderer.toneMappingExposure = 0.72
      renderer.shadowMap.enabled = true
      renderer.shadowMap.type = THREE.PCFSoftShadowMap
      renderer.setPixelRatio(Math.min(2, devicePixelRatio))
      renderer.setScissorTest(true)

      const scene = new THREE.Scene()
      const C = (h) => new THREE.Color(h)
      scene.background = C('#b9ddf7')
      scene.environment = skyEnvironment(renderer, { top: C('#2f86e6'), horizon: C('#b9ddf7'), ground: C('#7f9a58'), sun: C('#fff1dc') })
      scene.add(new THREE.HemisphereLight(C('#cfe9ff'), C('#b9a77f'), 0.25))
      const sun = new THREE.DirectionalLight(C('#fff1dc'), 2.6)
      sun.castShadow = true
      sun.shadow.mapSize.set(2048, 2048)
      sun.shadow.bias = -0.0005
      sun.shadow.normalBias = 0.02
      scene.add(sun, sun.target)
      const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 48).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x8fbf63, roughness: 0.95 }))
      ground.receiveShadow = true
      scene.add(ground)
      const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 500)

      // ---- the model lists ----
      async function models() {
        const out = []
        const tryAdd = (name, fn) => {
          if (only && !only.includes(name)) return
          try {
            const o = fn()
            if (o) out.push({ name, obj: o.isObject3D ? o : o.root })
          } catch (e) {
            errs.push(`${name}: ${e.message}`)
          }
        }
        if (set === 'props') {
          const P = await import('./js/props.js')
          const args = { pier: [10, 3], signpost: [[{ text: 'Castle', angle: 0 }, { text: 'Beach', angle: 2 }]], shopSign: ['SHOP', 3, 0.8, '#e94b3c'], graveyardFence: [6, 0], house: [0] }
          const skip = new Set(['prism'])
          for (const [k, f] of Object.entries(P)) if (typeof f === 'function' && !skip.has(k)) tryAdd(k, () => f(...(args[k] || [])))
          for (let i = 1; i < 4; i++) tryAdd('house' + i, () => P.house(i))
          tryAdd('gravestone1', () => P.gravestone(1))
          tryAdd('gravestone2', () => P.gravestone(2))
        } else if (set === 'characters') {
          const Ch = await import('./js/characters.js')
          for (const k of Object.keys(Ch.LOOKS)) tryAdd(k, () => new Ch.Person(Ch.LOOKS[k]))
          ;(Ch.RESIDENT_LOOKS || []).forEach((l, i) => tryAdd('resident' + i, () => new Ch.Person(l)))
          for (const k of ['Bear', 'Owl', 'Cat', 'Bunny', 'Ghost', 'Skeleton']) tryAdd(k.toLowerCase(), () => new Ch[k]())
          for (const k of ['deer', 'fox', 'chicken', 'squirrel', 'hedgehog', 'crab', 'frog']) tryAdd(k, () => new Ch.Critter(k))
          tryAdd('duck', () => Ch.makeDuck(false))
          tryAdd('duck2', () => Ch.makeDuck(true))
          tryAdd('gull', () => Ch.makeGull())
          tryAdd('butterfly', () => Ch.makeButterfly('#ff9fd1'))
        } else if (set === 'plants') {
          const N = await import('./js/nature.js')
          const P = await import('./js/props.js')
          const names = ['round', 'pine', 'palm', 'bush', 'rock', 'grass', 'mushroom', 'reeds', 'lamppost', 'flower:#ff6b8a']
          for (const n of names) tryAdd(n.split(':')[0], () => N.instanced(n, [{ x: 0, y: 0, z: 0, s: 1 }]))
          for (const n of ['appleTree', 'berryBush', 'carrotPatch', 'deadTree', 'pumpkin']) tryAdd(n, () => P[n]())
          tryAdd('cloud', () => N.cloud(Math.random))
        }
        return out
      }

      function stats(obj) {
        let tris = 0
        let draws = 0
        obj.traverse((m) => {
          if (!m.isMesh || !m.visible || m.material.visible === false) return
          const g = m.geometry
          tris += ((g.index ? g.index.count : g.attributes.position.count) / 3) * (m.isInstancedMesh ? m.count : 1)
          draws++
        })
        return { tris: Math.round(tris), draws }
      }

      const list = await models()
      window.MODELS = list.map((m) => ({ name: m.name, ...stats(m.obj) }))
      const n = list.length
      const cols = +(q.get('cols') || Math.ceil(Math.sqrt(n * 1.33)))
      const rows = Math.ceil(n / cols)
      for (const m of list) {
        m.obj.updateMatrixWorld(true)
        m.box = new THREE.Box3().setFromObject(m.obj)
      }
      const labels = list.map((m) => {
        const d = document.createElement('div')
        d.className = 'lbl'
        const s = stats(m.obj)
        d.textContent = `${m.name}  ${s.tris.toLocaleString()} tris · ${s.draws} draw${s.draws === 1 ? '' : 's'}`
        document.body.appendChild(d)
        return d
      })
      document.getElementById('err').textContent = errs.join('\n')
      window.ERRORS = errs

      function renderAll(t = 0) {
        const W = innerWidth
        const H = innerHeight
        renderer.setSize(W, H, false)
        const tw = W / cols
        const th = H / rows
        list.forEach((m, i) => {
          const cx = i % cols
          const cy = Math.floor(i / cols)
          const x = cx * tw
          const y = H - (cy + 1) * th
          labels[i].style.left = `${x + 4}px`
          labels[i].style.top = `${cy * th + 4}px`
          scene.add(m.obj)
          const size = m.box.getSize(new THREE.Vector3())
          const c = m.box.getCenter(new THREE.Vector3())
          const r = Math.max(size.x, size.y, size.z, 0.3) * 0.62
          camera.aspect = tw / th
          camera.updateProjectionMatrix()
          const dist = (r / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * (camera.aspect < 1 ? 1 / camera.aspect : 1) * 1.15 / zoom
          camera.position.set(c.x + Math.sin(yaw) * Math.cos(pitch) * dist, c.y + Math.sin(pitch) * dist, c.z + Math.cos(yaw) * Math.cos(pitch) * dist)
          camera.lookAt(c)
          sun.target.position.copy(c)
          sun.position.copy(c).addScaledVector(SUN_DIR, r * 6 + 10)
          const sc = sun.shadow.camera
          sc.left = sc.bottom = -r * 1.6
          sc.right = sc.top = r * 1.6
          sc.near = 0.5
          sc.far = r * 14 + 30
          sc.updateProjectionMatrix()
          ground.position.set(c.x, m.box.min.y - 0.001, c.z)
          renderer.setViewport(x, y, tw, th)
          renderer.setScissor(x, y, tw, th)
          renderer.render(scene, camera)
          scene.remove(m.obj)
        })
      }
      window.renderAll = renderAll
      renderAll()
      addEventListener('resize', () => renderAll())
      window.READY = true
    </script>
  </body>
</html>
