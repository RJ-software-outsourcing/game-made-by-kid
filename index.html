<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Games Made by Kid</title>
    <meta name="description" content="A growing collection of games made by a kid" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="home.css" />
    <!-- Start fetching the game list while the page is still parsing. -->
    <link rel="preload" href="games.json" as="fetch" crossorigin="anonymous" />
  </head>
  <body>
    <main>
      <header>
        <h1>🎮 Games Made by Kid</h1>
        <p>Pick a game to play!</p>
      </header>
      <ul id="games" class="games" aria-live="polite"></ul>
      <p id="status" class="status">Loading games…</p>
      <noscript><p class="status">Please turn on JavaScript to see the games.</p></noscript>
    </main>
    <script type="module" src="home.js"></script>
  </body>
</html>
